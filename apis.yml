apis:
- name: Jamf Pro API
  description: >-
    The modern Jamf Pro API, built on the OpenAPI 3.0 standard, for
    programmatically managing computers, mobile devices, policies, groups,
    inventory, and configuration on a Jamf Pro instance. Authenticated with
    bearer tokens or OAuth client-credential API Roles & Clients.
  humanURL: https://developer.jamf.com/jamf-pro/reference/jamf-pro-api
  baseURL: https://your-instance.jamfcloud.com/api
  properties:
  - type: Documentation
    url: https://developer.jamf.com/jamf-pro/docs
  - type: APIReference
    url: https://developer.jamf.com/jamf-pro/reference/jamf-pro-api
  - type: OpenAPI
    url: https://your-instance.jamfcloud.com/api/schema
- name: Jamf Pro Classic API
  description: >-
    The long-standing Classic API, the original resource for programmatically
    interacting with Jamf Pro, located at /JSSResource on each instance.
    Supports XML and JSON payloads and bearer-token authentication.
  humanURL: https://developer.jamf.com/jamf-pro/reference/classic-api
  baseURL: https://your-instance.jamfcloud.com/JSSResource
  properties:
  - type: APIReference
    url: https://developer.jamf.com/jamf-pro/reference/classic-api
- name: Jamf Platform API Gateway
  description: >-
    A single, unified gateway to access any combination of Jamf APIs —
    Blueprints, Compliance Benchmarks, Device Management Actions, Declaration
    Reporting, Devices, and Device Groups — described as the long-term future
    of APIs at Jamf.
  humanURL: https://developer.jamf.com/platform-api
  baseURL: https://developer.jamf.com/platform-api/reference
  properties:
  - type: APIReference
    url: https://developer.jamf.com/platform-api/reference
