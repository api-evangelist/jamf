aid: jamf
name: JAMF
description: >-
  Jamf is the standard in managing and securing Apple devices at scale for
  business, education, and government. Its cloud platform pairs Apple device
  management (MDM), identity, and endpoint security with a broad developer
  surface: the modern Jamf Pro API (OpenAPI 3.0, bearer-token and OAuth
  client-credential API Roles & Clients), the long-standing Classic API
  (/JSSResource, XML/JSON), the new unified Platform API Gateway (Blueprints,
  Compliance Benchmarks, Device Management Actions), plus the Jamf School,
  Jamf Protect, and Jamf Security APIs. Jamf publishes an llms.txt developer
  index, a hosted MCP server for documentation and code generation, a webhooks
  event catalog, and a trust center enumerating SOC 2, ISO 27001/27701, PCI
  DSS, HIPAA, GDPR, and NIST 800-53 posture.
